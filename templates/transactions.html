{% extends "layout.html" %}
{% block content %}
<div class="mb-8 flex justify-between items-center">
    <h2 class="text-2xl font-bold text-slate-900">Transactions Ledger</h2>
</div>

<!-- Add Transaction Form -->
<div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 mb-8">
    <h3 class="text-md font-bold text-slate-800 mb-4">Add New Transaction</h3>
    <form action="{{ url_for('transactions_page') }}" method="POST" class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Date</label>
            <input type="date" name="date" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Category</label>
            <input type="text" name="category" placeholder="e.g. Food" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Description</label>
            <input type="text" name="description" placeholder="e.g. Lunch" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Amount ($)</label>
            <input type="number" step="0.01" name="amount" placeholder="0.00" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Type</label>
            <select name="type" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
            </select>
        </div>
        <div class="md:col-span-5 flex justify-end mt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded text-sm transition">Add Transaction</button>
        </div>
    </form>
</div>

<!-- Ledger Table -->
<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                <th class="py-3">Date</th>
                <th class="py-3">Category</th>
                <th class="py-3">Description</th>
                <th class="py-3">Type</th>
                <th class="py-3 text-right">Amount</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-sm">
            {% for t in transactions %}
            <tr>
                <td class="py-3 text-slate-600">{{ t.Date }}</td>
                <td class="py-3 font-medium">{{ t.Category }}</td>
                <td class="py-3 text-slate-600">{{ t.Description }}</td>
                <td class="py-3">
                    <span class="px-2 py-1 text-xs rounded-full {% if t.Type == 'Income' %}bg-emerald-100 text-emerald-800{% else %}bg-rose-100 text-rose-800{% endif %}">
                        {{ t.Type }}
                    </span>
                </td>
                <td class="py-3 text-right font-semibold {% if t.Type == 'Income' %}text-emerald-600{% else %}text-rose-600{% endif %}">
                    ${{ "%.2f"|format(t.Amount) }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
